<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="/__mypa/theme.css" />
    <style>
      html,
      body {
        container-type: size;
      }
      .wx {
        height: 100%;
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 14px 16px 10px;
      }
      .wx__now {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 12px;
      }
      .wx__where {
        min-width: 0;
      }
      .wx__place {
        margin: 0;
        font-weight: 600;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .wx__cond {
        display: flex;
        align-items: center;
        gap: 6px;
        margin: 2px 0 0;
        font-size: 12px;
        color: var(--ds-muted);
      }
      .wx__icon {
        flex: 0 0 auto;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .wx__cond .wx__icon {
        color: var(--ds-accent);
      }
      .wx__temp {
        font-size: clamp(34px, 16vmin, 52px);
        font-weight: 600;
        letter-spacing: -0.04em;
        line-height: 1;
      }
      .wx__facts {
        margin: 0;
        font-size: 12px;
        color: var(--ds-fg-2);
      }
      .wx__hours {
        display: grid;
        grid-template-columns: repeat(6, 1fr);
        gap: 2px;
        padding: 8px 0;
        border-block: 1px solid var(--ds-border);
      }
      .wx__hour {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        font-size: 11px;
      }
      .wx__hour-t {
        color: var(--ds-muted);
      }
      .wx__hour .wx__icon {
        color: var(--ds-fg-2);
      }
      .wx__hour b {
        font-weight: 500;
      }
      .wx__days {
        margin-top: auto;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 6px;
      }
      .wx__day {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 3px;
        padding: 8px 6px;
        border-radius: var(--ds-radius-md);
        background: var(--ds-sunken);
        text-align: center;
        font-size: 12px;
      }
      .wx__day b {
        font-weight: 500;
      }
      .wx__day .wx__icon {
        color: var(--ds-fg-2);
      }
      .wx__day span {
        color: var(--ds-muted);
        font-size: 11px;
      }
      .wx__updated {
        align-self: flex-end;
        height: 20px;
        padding: 0 6px;
        margin: -4px -6px 0 0;
        border: 0;
        border-radius: var(--ds-radius-sm);
        background: transparent;
        color: var(--ds-faint, #8a8a8a);
        font-size: 10px;
        cursor: pointer;
      }
      .wx__updated:hover {
        background: var(--ds-hover);
        color: var(--ds-fg);
      }
      /* short widgets keep the essentials: drop the hourly strip, then the facts */
      @container (max-height: 268px) {
        .wx__hours {
          display: none;
        }
      }
      @container (max-height: 184px) {
        .wx__facts,
        .wx__updated {
          display: none;
        }
      }
      .wx__msg {
        margin: auto;
        text-align: center;
        max-width: 30ch;
      }
      .skeleton {
        border-radius: var(--ds-radius-md);
        background: var(--ds-hover);
        animation: pulse 1.4s ease-in-out infinite;
      }
      @keyframes pulse {
        50% {
          opacity: 0.5;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .skeleton {
          animation: none;
        }
      }
    </style>
    <script src="/__mypa/sdk.js"></script>
  </head>
  <body>
    <main class="wx" id="root">
      <div class="skeleton" style="height: 52px"></div>
      <div class="wx__days">
        <div class="skeleton" style="height: 52px"></div>
        <div class="skeleton" style="height: 52px"></div>
        <div class="skeleton" style="height: 52px"></div>
        <div class="skeleton" style="height: 52px"></div>
      </div>
    </main>
    <script src="weather.js"></script>
  </body>
</html>
