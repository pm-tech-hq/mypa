<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="/__mypa/theme.css" />
    <style>
      body {
        display: flex;
        flex-direction: column;
      }
      .hab {
        flex: 1;
        overflow: auto;
        padding: 12px 14px 6px;
      }
      .hab__grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr) repeat(7, 26px) 44px;
        align-items: center;
        column-gap: 4px;
        row-gap: 4px;
      }
      .hab__day {
        display: flex;
        flex-direction: column;
        align-items: center;
        line-height: 1.25;
        font-size: 11px;
        color: var(--ds-muted);
      }
      .hab__date {
        font-size: 10px;
        color: var(--ds-faint, #8a8a8a);
      }
      .hab__day.is-today .hab__date {
        color: var(--ds-accent-ink);
      }
      .hab__top {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        margin-bottom: 8px;
        min-height: 18px;
      }
      .hab__summary {
        font-size: 12px;
        color: var(--ds-muted);
      }
      .hab__summary.is-done {
        color: var(--ds-accent-ink);
        font-weight: 600;
      }
      .hab__label {
        min-width: 0;
        padding: 2px 4px;
        margin-left: -4px;
        border: 0;
        border-radius: 6px;
        background: transparent;
        font-weight: 500;
        text-align: left;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        cursor: text;
      }
      .hab__label:hover {
        background: var(--ds-hover);
      }
      .hab__rename {
        width: 100%;
        min-width: 0;
        height: 26px;
        padding: 0 6px;
        border: 1px solid var(--ds-accent);
        border-radius: 6px;
        background: var(--ds-surface);
        font-weight: 500;
        outline: none;
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--ds-accent) 16%, transparent);
      }
      .hab__day.is-today {
        color: var(--ds-accent-ink);
        font-weight: 600;
      }
      .hab__name {
        display: flex;
        align-items: center;
        gap: 6px;
        min-width: 0;
        font-weight: 500;
      }

      .hab__del {
        flex: 0 0 auto;
        display: grid;
        place-items: center;
        opacity: 0;
        width: 20px;
        height: 20px;
        padding: 0;
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: var(--ds-faint, #8a8a8a);
        cursor: pointer;
      }
      .hab__row:hover .hab__del,
      .hab__del:focus-visible {
        opacity: 1;
      }
      .hab__del:hover {
        color: var(--ds-danger);
        background: var(--ds-hover);
      }
      .hab__cell {
        display: grid;
        place-items: center;
        width: 26px;
        height: 26px;
        padding: 0;
        color: var(--ds-accent-fg);
        border: 1.5px solid var(--ds-border-strong);
        border-radius: 7px;
        background: var(--ds-surface);
        cursor: pointer;
        transition:
          background-color 120ms ease,
          border-color 120ms ease,
          scale 120ms var(--ds-ease-out);
      }
      .hab__cell:hover {
        border-color: var(--ds-accent);
      }
      .hab__cell:active {
        scale: 0.88;
      }
      .hab__cell.is-today:not(.is-on) {
        border-color: var(--ds-accent);
        background: var(--ds-accent-soft);
      }
      .hab__cell.is-on {
        background: var(--ds-accent);
        border-color: var(--ds-accent);
      }
      .hab__streak {
        text-align: right;
        font-size: 11px;
        color: var(--ds-muted);
      }
      .hab__streak.is-live {
        color: var(--ds-accent-ink);
        font-weight: 600;
      }
      .hab__row {
        display: contents;
      }
      .hab__add {
        display: flex;
        gap: 6px;
        padding: 8px 14px 12px;
        border-top: 1px solid var(--ds-border);
      }
      .hab__empty {
        padding: 24px 8px;
        text-align: center;
      }
      .hab__undo {
        position: fixed;
        left: 12px;
        right: 12px;
        bottom: 60px;
        display: flex;
        align-items: center;
        gap: 4px;
        min-height: 36px;
        padding: 4px 4px 4px 12px;
        border-radius: var(--ds-radius-md);
        background: var(--ds-fg);
        color: var(--ds-surface);
        font-size: 12px;
        box-shadow: 0 6px 20px rgb(0 0 0 / 0.18);
      }
      .hab__undo[hidden] {
        display: none;
      }
      .hab__undo span {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .hab__undo button {
        display: grid;
        place-items: center;
        height: 28px;
        min-width: 28px;
        padding: 0 10px;
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      .hab__undo button:hover {
        background: rgb(255 255 255 / 0.16);
      }
    </style>
    <script src="/__mypa/sdk.js"></script>
  </head>
  <body>
    <main class="hab">
      <div class="hab__top"><span class="hab__summary num" id="summary" aria-live="polite"></span></div>
      <div class="hab__grid" id="grid"></div>
      <p class="hab__empty muted" id="empty" hidden>Add a habit below, then tick each day you do it.</p>
    </main>
    <form class="hab__add" id="form">
      <input class="field" id="name" placeholder="New habit, e.g. Read 20 minutes" maxlength="60" aria-label="New habit" />
      <button class="btn" type="submit">Add</button>
    </form>
    <div class="hab__undo" id="undo" role="status" hidden>
      <span id="undo-label"></span>
      <button type="button" id="undo-btn">Undo</button>
      <button type="button" id="undo-close" aria-label="Dismiss"></button>
    </div>
    <script src="habits.js"></script>
  </body>
</html>
