<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- myPA serves its runtime and theme to every widget. -->
    <link rel="stylesheet" href="/__mypa/theme.css" />
    <link rel="stylesheet" href="style.css" />
    <script src="/__mypa/sdk.js"></script>
  </head>
  <body>
    <main class="counter">
      <p class="counter__label muted" id="label">Clicks</p>
      <p class="counter__value num" id="value">0</p>
      <div class="counter__actions">
        <button class="btn ghost" id="reset" type="button">Reset</button>
        <button class="btn primary" id="add" type="button">Add</button>
      </div>
    </main>
    <script src="widget.js"></script>
  </body>
</html>
